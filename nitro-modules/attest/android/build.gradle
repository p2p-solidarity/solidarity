/*
 * build.gradle
 * @solidarity/nitro-attest (Android)
 *
 * Merged from the former nitro-mrz-ocr + nitro-nfc-passport +
 * nitro-passport-zk + nitro-semaphore modules (2.0.0 nitro convergence).
 * Modeled after react-native-mmkv's Nitro module gradle setup: pulls in
 * the nitrogen autolinking gradle, defines the Kotlin/C++ build, and
 * declares the union of the four modules' runtime deps.
 *
 * The Rust cdylibs are loaded via System.loadLibrary at runtime once the
 * build scripts land the .so files under src/main/jniLibs/<abi>/:
 *   - `libpassport_zk_mopro.so`  ← scripts/build-android.sh
 *   - `libsemaphore_bindings.so` ← semaphore/rust/build-android.sh
 * Without those, the Kotlin Hybrids throw UnsupportedOperationException but
 * the module still configures cleanly.
 */
buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    // Match the rest of the Nitro ecosystem to avoid drift.
    classpath "com.android.tools.build:gradle:9.1.0"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["x86", "x86_64", "armeabi-v7a", "arm64-v8a"]
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply from: "../nitrogen/generated/android/Attest+autolinking.gradle"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["SolidarityAttest_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["SolidarityAttest_" + name]).toInteger()
}

android {
  namespace "com.margelo.nitro.gg.solidarity.attest"

  ndkVersion getExtOrDefault("ndkVersion")
  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -Wextra -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        abiFilters (*reactNativeArchitectures())

        buildTypes {
          debug {
            cppFlags "-O1 -g"
          }
          release {
            cppFlags "-O2"
          }
        }
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  packagingOptions {
    excludes = [
      "META-INF",
      "META-INF/**",
      "**/libNitroModules.so",
      "**/libc++_shared.so",
      "**/libfbjni.so",
      "**/libjsi.so",
      "**/libfolly_json.so",
      "**/libfolly_runtime.so",
      "**/libglog.so",
      "**/libhermes.so",
      "**/libhermes-executor-debug.so",
      "**/libhermes_executor.so",
      "**/libreactnative.so",
      "**/libreactnativejni.so",
      "**/libturbomodulejsijni.so",
      "**/libreact_nativemodule_core.so",
      "**/libjscexecutor.so"
    ]
  }

  buildFeatures {
    buildConfig true
    prefab true
  }

  androidResources {
    noCompress += ['json', 'bin']
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      java.srcDirs += [
        "${project.projectDir}/../nitrogen/generated/android/kotlin",
      ]

      jniLibs.srcDirs = ["${project.projectDir}/src/main/jniLibs"]

      if (isNewArchitectureEnabled()) {
        java.srcDirs += [
          "${project.buildDir}/generated/source/codegen/java"
        ]
      }
    }
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  // RN: provided by the app's react-native gradle plugin.
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"

  // NitroModules core — provides HybridObject base, ArrayBuffer, Promise.
  implementation project(":react-native-nitro-modules")

  // Coroutines for the off-thread NFC read loop, proof generation and
  // Promise.async.
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

  // JNA backs BOTH uniffi Kotlin binding sets (uniffi.mopro.* loading
  // `libpassport_zk_mopro.so` and uniffi.semaphore_bindings.* loading
  // `libsemaphore_bindings.so`). `@aar` is required because JNA ships a
  // regular jar + an aar with the native libs (libjnidispatch.so); without
  // the aar `Native.load()` fails at runtime with
  // `UnsatisfiedLinkError: jnidispatch`. Version pinned to what
  // mopro-ffi 0.3.x's generated bindings expect (UniFFI Kotlin runtime).
  implementation "net.java.dev.jna:jna:5.13.0@aar"

  // ─── MrzOcr ──────────────────────────────────────────────────────────────

  // VisionCamera — gives us the concrete `Frame` class to downcast to
  // and read the underlying ImageProxy/MediaImage from. The Frame
  // Processor plugin contract requires us to depend on this.
  implementation project(":react-native-vision-camera")

  // ML Kit Text Recognition v2 — bundled Latin script model.
  //   * No Play Services dependency (works on AOSP / GMS-less devices).
  //   * Model ships inside the AAR (~3MB APK uplift) so the first scan
  //     is fast and no network call is made on launch.
  //   * Latin-script recogniser handles ICAO 9303 OCR-B fine; native
  //     TD3 check-digit validation filters OCR noise before JS sees it.
  // https://developers.google.com/ml-kit/vision/text-recognition/v2/android
  implementation "com.google.mlkit:text-recognition:16.0.1"

  // CameraX core — required because VisionCamera frames are wrapped
  // ImageProxy instances; we need the ImageProxy type to read mediaImage
  // out of them. Pinned to the same version VisionCamera v5 ships.
  implementation "androidx.camera:camera-core:1.7.0-alpha01"

  // ─── NfcPassport ─────────────────────────────────────────────────────────

  // jmrtd — the de-facto Android MRTD (Machine Readable Travel Document)
  // reader. Implements BAC + PACE + secure messaging + LDS parsing per
  // ICAO 9303. The 0.7.x line is the last release supporting the API
  // surface we mirror from the AndyQ iOS library; 0.8.x changed key
  // wrappers we don't want to track yet.
  // https://central.sonatype.com/artifact/org.jmrtd/jmrtd
  implementation("org.jmrtd:jmrtd:0.7.42") {
    // Strip the cvc dep — we don't use Card Verifiable Certificates
    // (EAC2 terminal auth path) and it drags in extra BouncyCastle
    // variants that conflict with the ones we pin below.
    exclude group: "org.ejbca.cvc"
  }

  // scuba-sc-android — Android-specific Smart Card adapter that jmrtd
  // delegates to for IsoDep transceive (CardService impl). Pulls in the
  // matching scuba-smartcards core jar (which carries net.sf.scuba.data.Gender
  // and CardService base classes).
  // https://central.sonatype.com/artifact/net.sf.scuba/scuba-sc-android
  implementation "net.sf.scuba:scuba-sc-android:0.0.23"

  // BouncyCastle — used by jmrtd for SOD signature verification (CMS
  // SignedData), DG14 parsing, and PACE/BAC key derivation. jmrtd 0.7.42
  // transitively pulls `bcprov-jdk18on` + `bcpkix-jdk18on:1.78`; we pin
  // 1.78.1 here so we pick up the SHA-3 + EdDSA fixes without exploding
  // the dep graph. The `jdk18on` artifact runs on Android (ART >= API 24).
  implementation "org.bouncycastle:bcprov-jdk18on:1.78.1"
  implementation "org.bouncycastle:bcutil-jdk18on:1.78.1"
  implementation "org.bouncycastle:bcpkix-jdk18on:1.78.1"

  // ─── Semaphore ───────────────────────────────────────────────────────────

  // EncryptedSharedPreferences for identity + nullifier persistence
  // (the Android equivalent of the iOS Keychain we use in HybridSemaphore.swift).
  // 1.1.0-alpha06 is the last release that includes `MasterKeys.getOrCreate`;
  // the 1.0.0 stable also has it but exposes a slightly different builder API.
  implementation "androidx.security:security-crypto:1.0.0"
}
