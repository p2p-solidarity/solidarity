[package]
name = "solidarity-semaphore-bindings"
version = "0.1.0"
edition = "2021"
description = "uniffi wrapper for semaphore-rs (https://github.com/semaphore-protocol/semaphore-rs). Vendored shim crate so the Nitro module can build the same `libsemaphore_bindings.a` shipped in SemaphoreSwift's xcframework for both iOS and Android, without forking the upstream codebase."

[lib]
name = "semaphore_bindings"
# staticlib: linked into the iOS xcframework (libsemaphore_bindings.a)
# cdylib:    loaded into Android via System.loadLibrary("semaphore_bindings")
crate-type = ["staticlib", "cdylib", "rlib"]

# `cargo run --bin uniffi-bindgen` is invoked by build-android.sh /
# build-ios.sh to regenerate the Kotlin / Swift wrappers from this crate.
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
# Pinned to a specific commit on semaphore-protocol `main` so iOS + Android
# always link the same crate. The upstream was renamed from `semaphore-rs`
# → `semaphore-protocol` (lib name `semaphore`) — bump only when re-publishing
# both the iOS xcframework AND the Android .so so commitments don't drift
# between platforms. (`rev = "main"` would NOT resolve — cargo treats `rev`
# as a literal git revision, so a branch name fails with NotFound.)
semaphore = { package = "semaphore-protocol", git = "https://github.com/semaphore-protocol/semaphore-rs", rev = "ccf81861d4f10f196d3c705746003c54611fe784" }
uniffi = { version = "0.28", features = ["build", "cli", "tokio"] }
thiserror = "1"
serde_json = "1"
num-bigint = "0.4"
# Match the arkworks pins from upstream semaphore — bumping them here without
# bumping upstream would yield two incompatible Fq types at link time.
ark-ed-on-bn254 = { version = "=0.5.0", default-features = false }
ark-ff = { version = "=0.5.0", default-features = false }

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }
