# SolidarityNfcPassport Android gradle defaults.
# Values mirror react-native-mmkv / proximity / spruce-did so we stay aligned
# with the rest of the Nitro ecosystem the app already pulls in.
SolidarityNfcPassport_kotlinVersion=2.1.20
# jmrtd + scuba-sc-android target minSdk 23, but the rest of Solidarity
# Android runs at 26+. We follow the higher floor so Java-time APIs and
# androidx.security primitives can land without runtime gating.
SolidarityNfcPassport_minSdkVersion=26
SolidarityNfcPassport_targetSdkVersion=36
SolidarityNfcPassport_compileSdkVersion=36
SolidarityNfcPassport_ndkVersion=27.1.12297006
