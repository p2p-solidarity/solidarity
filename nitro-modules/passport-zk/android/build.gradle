/*
 * build.gradle
 * @solidarity/nitro-passport-zk (Android)
 *
 * Modeled after react-native-mmkv's Nitro module gradle setup. Pulls in
 * the nitrogen autolinking gradle, defines the Kotlin/C++ build, and
 * declares the runtime deps we need (kotlinx coroutines). The actual
 * Rust passport_zk_mopro cdylib is loaded via System.loadLibrary at
 * runtime once `rust/build-android.sh` lands the .so files under
 * src/main/jniLibs/<abi>/ — without those, the Kotlin Hybrid throws
 * UnsupportedOperationException but the module still configures cleanly.
 */
buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    // Match the rest of the Nitro ecosystem to avoid drift.
    classpath "com.android.tools.build:gradle:9.1.0"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["x86", "x86_64", "armeabi-v7a", "arm64-v8a"]
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply from: "../nitrogen/generated/android/PassportZK+autolinking.gradle"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["SolidarityPassportZk_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["SolidarityPassportZk_" + name]).toInteger()
}

android {
  namespace "com.margelo.nitro.gg.solidarity.passportzk"

  ndkVersion getExtOrDefault("ndkVersion")
  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -Wextra -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        abiFilters (*reactNativeArchitectures())

        buildTypes {
          debug {
            cppFlags "-O1 -g"
          }
          release {
            cppFlags "-O2"
          }
        }
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  packagingOptions {
    excludes = [
      "META-INF",
      "META-INF/**",
      "**/libNitroModules.so",
      "**/libc++_shared.so",
      "**/libfbjni.so",
      "**/libjsi.so",
      "**/libfolly_json.so",
      "**/libfolly_runtime.so",
      "**/libglog.so",
      "**/libhermes.so",
      "**/libhermes-executor-debug.so",
      "**/libhermes_executor.so",
      "**/libreactnative.so",
      "**/libreactnativejni.so",
      "**/libturbomodulejsijni.so",
      "**/libreact_nativemodule_core.so",
      "**/libjscexecutor.so"
    ]
  }

  buildFeatures {
    buildConfig true
    prefab true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      java.srcDirs += [
        // Nitrogen-generated kotlin (also added by autolinking.gradle, kept
        // here as a safety net if autolinking ordering changes).
        "${project.projectDir}/../nitrogen/generated/android/kotlin",
      ]

      if (isNewArchitectureEnabled()) {
        java.srcDirs += [
          "${project.buildDir}/generated/source/codegen/java"
        ]
      }
    }
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  // RN: provided by the app's react-native gradle plugin.
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"

  // NitroModules core — provides HybridObject base, ArrayBuffer, Promise.
  implementation project(":react-native-nitro-modules")

  // Coroutines for the off-thread proof generation.
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

  // JNA backs the mopro UniFFI Kotlin bindings (uniffi.mopro.*) — the
  // generated mopro.kt declares `com.sun.jna.Library` interfaces that load
  // `libpassport_zk_mopro.so` from jniLibs at runtime. `@aar` is required
  // because JNA ships a regular jar + an aar with the native libs; we
  // need the aar for Android. Version pinned to what mopro-ffi 0.3.x's
  // generated bindings expect (UniFFI Kotlin runtime).
  implementation "net.java.dev.jna:jna:5.13.0@aar"
}
